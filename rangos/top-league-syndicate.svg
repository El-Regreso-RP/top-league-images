<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
    <defs>
      <radialGradient id="novaR" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#dffaff"/>
        <stop offset="50%" stop-color="#5DD8E6"/>
        <stop offset="100%" stop-color="#0d4a5c" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="novaL" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#aef0ff"/>
        <stop offset="100%" stop-color="#2196b8"/>
      </linearGradient>
    </defs>
    <circle cx="128" cy="128" r="120" fill="url(#novaR)" opacity="0.35"/>
    <!-- 8-pointed star: large -->
    <polygon points="128,8 144,112 248,128 144,144 128,248 112,144 8,128 112,112" fill="url(#novaL)"/>
    <!-- diagonal points -->
    <polygon points="128,40 138,118 216,128 138,138 128,216 118,138 40,128 118,118" fill="#5DD8E6" opacity="0.55" transform="rotate(45 128 128)"/>
    <!-- inner core -->
    <circle cx="128" cy="128" r="42" fill="#06181f"/>
    <circle cx="128" cy="128" r="42" fill="none" stroke="#aef0ff" stroke-width="1.5"/>
    <!-- pinpoint stars around -->
    <circle cx="60" cy="60" r="2" fill="#fff"/>
    <circle cx="200" cy="64" r="1.5" fill="#fff"/>
    <circle cx="56" cy="200" r="1.5" fill="#fff"/>
    <circle cx="208" cy="200" r="2" fill="#fff"/>
    <!-- inner spark -->
    <polygon points="128,98 134,124 160,128 134,132 128,158 122,132 96,128 122,124" fill="#aef0ff"/>
    <circle cx="128" cy="128" r="6" fill="#fff"/>
    <g><text x="128" y="234" font-family="Audiowide, sans-serif" font-size="14" letter-spacing="2" fill="#aef0ff" text-anchor="middle" opacity="0.85">I</text></g>
  </svg>