<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
    <defs>
      <linearGradient id="chromeA" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="35%" stop-color="#cfd9e3"/>
        <stop offset="55%" stop-color="#5a6b7c"/>
        <stop offset="80%" stop-color="#cfd9e3"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </linearGradient>
      <linearGradient id="chromeB" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#a0aebc"/>
        <stop offset="50%" stop-color="#2c3744"/>
        <stop offset="100%" stop-color="#9aa8b6"/>
      </linearGradient>
      <linearGradient id="iridescent" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#a0e7ff"/>
        <stop offset="40%" stop-color="#e7c0ff"/>
        <stop offset="80%" stop-color="#fff0a0"/>
      </linearGradient>
    </defs>
    <!-- outer diamond -->
    <polygon points="128,8 248,128 128,248 8,128" fill="url(#chromeA)" stroke="#ffffff" stroke-width="2"/>
    <!-- top-left facet -->
    <polygon points="128,8 128,128 8,128" fill="url(#chromeB)" opacity="0.35"/>
    <!-- bottom-right facet -->
    <polygon points="128,248 128,128 248,128" fill="url(#chromeB)" opacity="0.55"/>
    <!-- crystal cuts -->
    <polygon points="128,8 200,80 128,128 56,80" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
    <polygon points="128,248 200,176 128,128 56,176" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
    <line x1="56" y1="80" x2="56" y2="176" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <line x1="200" y1="80" x2="200" y2="176" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <!-- iridescent diagonal flare -->
    <polygon points="128,8 144,8 128,128 112,128" fill="url(#iridescent)" opacity="0.4"/>
    <!-- inner diamond outline -->
    <polygon points="128,52 204,128 128,204 52,128" fill="rgba(0,0,0,0.35)" stroke="#fff" stroke-width="1.5"/>
    <!-- center facet diamond -->
    <polygon points="128,92 164,128 128,164 92,128" fill="url(#chromeB)" opacity="0.7" stroke="#fff" stroke-width="1"/>
    <polygon points="128,108 148,128 128,148 108,128" fill="#fff" opacity="0.95"/>
    <g><text x="128" y="234" font-family="Audiowide, sans-serif" font-size="14" letter-spacing="2" fill="#ffffff" text-anchor="middle" opacity="0.85">VII</text></g>
  </svg>